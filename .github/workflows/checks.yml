name: Classroom checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  classroom:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: classroom
          POSTGRES_PASSWORD: classroom
          POSTGRES_DB: truecost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classroom -d truecost_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://classroom:classroom@localhost:5432/truecost_test
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start classroom server
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/truecost-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
        env:
          DATABASE_URL: postgresql+psycopg://classroom:classroom@localhost:5432/truecost_test
          INSTRUCTOR_SECRET: ci-classroom-only-instructor-key
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_INSTRUCTOR_SECRET: ci-classroom-only-instructor-key
      - name: Build and verify production container
        run: bash scripts/verify-container.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: classroom-browser-results
          path: frontend/test-results/
