services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truecost}
      POSTGRES_USER: ${POSTGRES_USER:-classroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classroom}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - classroom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD:-classroom}@db:5432/${POSTGRES_DB:-truecost}
      INSTRUCTOR_SECRET: ${INSTRUCTOR_SECRET:?Set INSTRUCTOR_SECRET in .env}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  classroom-data:
